name: Prek

on:
  pull_request:

concurrency:
  group: prek-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prek:
    name: Run prek
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run prek
        uses: j178/prek-action@v2
        with:
          prek-version: "0.4.1"
          extra-args: "--all-files --skip swiftlint --skip swiftformat"

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: "--force-exclude"

      - name: Run SwiftFormat
        uses: docker://ghcr.io/nicklockwood/swiftformat:0.61.1
        with:
          args: ". --lint --swift-version 6.3"

  validate:
    name: Build, test, docs, and demo
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release package
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Test canonical Boolean strings in French
        env:
          FORMKIT_ASSERT_FRENCH: "1"
        run: |
          formkit_test_bundle="$(find "$(swift build --show-bin-path)" -maxdepth 1 -name '*.xctest' -print -quit)"
          xcrun xctest \
            -XCTest FormKitSwiftTests.FormKitLocalizationRegressionTests \
            -AppleLanguages '(fr)' \
            "$formkit_test_bundle"

      - name: Generate DocC
        run: scripts/make-docs.sh .build/docc-site formkit-swift

      - name: Build demo
        run: >-
          xcodebuild build
          -project Example/FormKitSwiftDemo/FormKitSwiftDemo.xcodeproj
          -scheme FormKitSwiftDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Run controlled-focus UI tests
        run: >-
          xcodebuild test
          -project Example/FormKitSwiftDemo/FormKitSwiftDemo.xcodeproj
          -scheme FormKitSwiftDemo
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          CODE_SIGNING_ALLOWED=NO
