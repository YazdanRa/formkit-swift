name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve package
        run: swift package resolve

      - name: Build release package
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Test canonical Boolean strings in French
        env:
          FORMKIT_ASSERT_FRENCH: "1"
        run: >-
          xcrun xctest
          -XCTest FormKitSwiftTests.FormKitLocalizationRegressionTests
          -AppleLanguages '(fr)'
          "$(swift build --show-bin-path)/FormKitSwiftTests.xctest"

      - name: Build demo
        run: >-
          xcodebuild build
          -project Example/FormKitSwiftDemo/FormKitSwiftDemo.xcodeproj
          -scheme FormKitSwiftDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Run controlled-focus UI tests
        run: >-
          xcodebuild test
          -project Example/FormKitSwiftDemo/FormKitSwiftDemo.xcodeproj
          -scheme FormKitSwiftDemo
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          CODE_SIGNING_ALLOWED=NO

  release:
    name: Release version
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docs:
    name: Build and deploy DocC
    runs-on: macos-26
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate DocC static site
        run: scripts/make-docs.sh .build/docc-site "${{ github.event.repository.name }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/docc-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
